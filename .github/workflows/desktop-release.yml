name: Desktop release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Public release tag to attach installers to
        default: v0.1.5
jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            builder: --mac
          - os: windows-latest
            name: win
            builder: --win
          - os: ubuntu-latest
            name: linux
            builder: --linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Linux pack tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg
      - name: Load Mac signing certificate
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_SIGNING_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "Add MAC_SIGNING_P12 and MAC_SIGNING_PASSWORD secrets for Mac signing."
            exit 1
          fi
          echo "Mac signing certificate will be loaded by electron-builder via CSC_LINK."
      - name: Pack desktop
        working-directory: apps/desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_SIGNING_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        run: |
          node scripts/build.mjs
          electron_version=$(node -p "require('electron/package.json').version")
          echo "Packing with Electron $electron_version"
          set +e
          case "${{ runner.os }}" in
            macOS) arch_flags="--x64 --arm64" ;;
            Linux) arch_flags="--x64 --arm64" ;;
            *) arch_flags="" ;;
          esac
          npx electron-builder --publish never --config.electronVersion="$electron_version" ${{ matrix.builder }} $arch_flags
          status=$?
          set -e
          shopt -s nullglob
          files=(release/Bana.Copilot*.dmg release/Bana.Copilot*.zip release/Bana.Copilot*.exe release/Bana.Copilot*.AppImage release/Bana.Copilot*.deb release/Bana.Copilot*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "electron-builder exited $status with no installers"
            exit 1
          fi
          echo "Installers ready (electron-builder exit $status):"
          ls -lah "${files[@]}"
      - name: Check Mac signature
        if: runner.os == 'macOS'
        working-directory: apps/desktop/release
        run: |
          set -euo pipefail
          for app in mac/"Bana Copilot.app" mac-arm64/"Bana Copilot.app"; do
            codesign --verify --deep --strict "$app"
            codesign -dvv "$app" 2>&1 | grep "TeamIdentifier=JLNBDBGKYQ"
            echo "Signed with Softblue team identity ✓"
          done
      - name: Smoke Linux binaries
        if: runner.os == 'Linux'
        working-directory: apps/desktop/release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimage=(Bana.Copilot*-x86_64.AppImage)
          test ${#appimage[@]} -eq 1
          test -f Bana.Copilot*-arm64.AppImage
          deb_x64=(Bana.Copilot*-amd64.deb)
          deb_arm=(Bana.Copilot*-arm64.deb)
          tar_arm=(Bana.Copilot*-arm64.tar.gz)
          test ${#deb_x64[@]} -eq 1
          test ${#deb_arm[@]} -eq 1
          test ${#tar_arm[@]} -eq 1
          test -f Bana.Copilot*-x64.tar.gz
          chmod +x "${appimage[0]}"
          "./${appimage[0]}" --appimage-extract >/dev/null
          binary=$(find squashfs-root -type f -name bana-copilot | head -n 1)
          test -n "$binary"
          test -x "$binary"
          file "$binary" | grep -q x86-64
          desktop=$(find squashfs-root -name '*.desktop' | head -n 1)
          test -n "$desktop"
          cat "$desktop"
          grep -E 'Exec=(.*bana-copilot|AppRun)' "$desktop"
          grep -E 'StartupWMClass=bana-copilot' "$desktop"
          dpkg-deb -c "${deb_x64[0]}" | grep -E '/bana-copilot$'
          test "$(dpkg-deb -f "${deb_x64[0]}" Architecture)" = amd64
          test "$(dpkg-deb -f "${deb_arm[0]}" Architecture)" = arm64
          mkdir arm-check
          tar -xzf "${tar_arm[0]}" -C arm-check
          file "$(find arm-check -type f -name bana-copilot | head -n 1)" | grep -q aarch64
          rm -rf squashfs-root arm-check
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 1
          path: |
            apps/desktop/release/Bana.Copilot*.dmg
            apps/desktop/release/Bana.Copilot*.zip
            apps/desktop/release/Bana.Copilot*.exe
            apps/desktop/release/Bana.Copilot*.AppImage
            apps/desktop/release/Bana.Copilot*.deb
            apps/desktop/release/Bana.Copilot*.tar.gz
  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      RELEASES_REPO: anjorintosin/bana-copilot-releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-installers
          merge-multiple: true
      - name: Publish installers
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "Add the RELEASES_TOKEN secret to publish."; exit 1; }
          notes="docs/releases/$TAG.md"
          test -f "$notes" || { echo "Missing $notes"; exit 1; }
          ls -lah dist-installers
          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$RELEASES_REPO" --title "Bana Copilot ${TAG#v}" --notes-file "$notes"
            gh release upload "$TAG" dist-installers/* --repo "$RELEASES_REPO" --clobber
          else
            gh release create "$TAG" dist-installers/* --repo "$RELEASES_REPO" --title "Bana Copilot ${TAG#v}" --notes-file "$notes" --latest
          fi
