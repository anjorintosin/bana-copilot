name: Desktop release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Public release tag to attach installers to
        default: v0.1.1
jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            builder: --mac
          - os: windows-latest
            name: win
            builder: --win
          - os: ubuntu-latest
            name: linux
            builder: --linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Linux pack tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg
      - name: Pack desktop
        working-directory: apps/desktop
        shell: bash
        run: |
          node scripts/build.mjs
          npx --yes electron-builder@25.1.8 --publish never --config.electronVersion=39.2.7 ${{ matrix.builder }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
