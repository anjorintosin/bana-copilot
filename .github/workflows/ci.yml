name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test -w @meeting-copilot/desktop
      - run: npm run build -w @meeting-copilot/desktop
      - run: npx tsc --pretty false --noEmit -p apps/api
        continue-on-error: true
      - run: npx tsc --pretty false --noEmit -p apps/orchestrator
        continue-on-error: true
