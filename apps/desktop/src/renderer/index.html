<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; connect-src 'self' http: https: ws: wss:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:"
    />
    <title>Bana Copilot</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="hud collapsed" id="hud">
      <header id="topbar">
        <button type="button" class="mark-btn" id="back-btn" data-tip="Back" aria-label="Back">
          <svg class="mark-back" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <form class="ask-bar" id="ask-form">
          <input id="ask-input" type="text" placeholder="Ask anything or solve your screen" autocomplete="off" />
          <button type="submit" class="send-btn" id="send-btn" data-tip="Assist" aria-label="Assist">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 10L4 15l5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M20 4v7a4 4 0 0 1-4 4H4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </form>
      </header>

      <div class="hud-subbar" id="hud-subbar">
        <div class="shot-chip" id="shot-chip" hidden>
          <svg class="shot-check" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 13l4 4L19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>Viewed screen</span>
          <img id="shot-preview" alt="" hidden />
        </div>
        <div class="subbar-spacer"></div>
        <button type="button" class="assist-top-btn" id="assist-top-btn">Assist</button>
      </div>

      <p class="ghost-chip" id="ghost-chip" hidden></p>

      <p class="hud-tip" id="hud-tip" hidden></p>

      <div class="popover modes-pop" id="modes-pop" hidden>
        <div class="modes-grid" id="modes-grid"></div>
        <button type="button" class="secondary" id="modes-manage">Manage</button>
      </div>

      <div class="popover history-pop" id="history-pop" hidden>
        <section class="hist-section">
          <p class="label">Sessions</p>
          <div class="hist-list" id="history-sessions"></div>
        </section>
      </div>

      <div class="thread" id="thread"></div>
      <p class="pending" id="pending" hidden>They're still talking…</p>
      <div class="answer-loader" id="answer-loader" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <p id="answer-loader-text">Working on it…</p>
      </div>

      <footer class="hud-toolbar" id="hud-toolbar">
        <button type="button" class="icon-btn logo-btn" id="home-btn" data-tip="Open Settings ⌘," aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M12 7v5l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path d="M7 12a5 5 0 0 0 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <div class="icon-row">
          <button type="button" class="icon-btn" id="screen-btn" data-tip="Screen" aria-label="Screen">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2" />
              <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" />
              <path d="M21 15l-5-5L5 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button type="button" class="icon-btn share-btn" id="share-btn" aria-pressed="false" data-tip="Visibility" aria-label="Visibility">
            <svg class="eye-slash" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
          </button>
          <button type="button" class="icon-btn" id="modes-btn" data-tip="Mode" aria-label="Mode">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="4" width="6" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="2" />
              <rect x="14" y="4" width="6" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="2" />
              <rect x="4" y="14" width="6" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="2" />
              <rect x="14" y="14" width="6" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
          </button>
          <button type="button" class="listen-pill icon-btn" id="listen-pill" data-tip="Start session" aria-label="Start session">
            <span class="listen-clock" id="listen-clock">00:00</span>
            <span class="dot" id="status-dot"></span>
            <span class="listen-label" id="listen-label">Start session</span>
            <span class="level"><span id="meter-fill"></span></span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 12h2l2-5 3 10 3-7 2 2h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
        <button type="button" class="icon-btn history-btn" id="history-btn" data-tip="History" aria-label="History">
          <span class="history-label">History</span>
          <span class="chev">▾</span>
        </button>
      </footer>

      <footer class="composer" id="composer" hidden></footer>

      <div class="live-anchor" hidden>
        <div class="card" id="card">
          <div class="hist" id="hist-bar">
            <button id="prev-btn" type="button" class="hist-btn" disabled>Back</button>
            <span id="hist-label">Live</span>
            <span class="kind" id="kind-label" hidden></span>
            <button id="next-btn" type="button" class="hist-btn" disabled>Next</button>
          </div>
          <p class="question idle" id="question">Ask anything, or press Assist.</p>
          <div id="answer" class="placeholder">Answers show here when you press Enter or Assist.</div>
        </div>
      </div>

      <div class="compat" hidden>
        <div class="launch" id="launch">
          <button type="button" class="launch-start" id="launch-start">Start</button>
        </div>
        <select id="stage-select" title="Interview stage"></select>
        <button type="button" class="icon-btn" id="smart-btn" aria-pressed="false">Smart</button>
        <button type="button" class="timer-btn" id="session-btn">End</button>
        <button type="button" class="icon-btn" id="collapse-btn">▾</button>
        <button type="button" class="icon-btn" id="hide-btn">×</button>
        <div class="actions" id="actions">
          <button type="button" data-action="say_next">What should I say</button>
          <button type="button" data-action="follow_up">Follow-ups</button>
          <button type="button" data-action="fact_check">Fact check</button>
          <button type="button" data-action="recap">Recap</button>
          <button type="button" data-action="screen">Solve screen</button>
        </div>
        <div class="popover" id="settings-pop" hidden>
          <p class="label">Listening</p>
          <div class="choice-row">
            <button type="button" class="chip active" id="source-system">Their audio</button>
            <button type="button" class="chip" id="source-mic">My mic</button>
          </div>
          <div class="choice-row">
            <button type="button" class="chip active" id="mode-auto">Auto</button>
            <button type="button" class="chip" id="mode-shortcut">Shortcut</button>
          </div>
          <p class="fine" id="mic-status">Off — captures their voice, not yours.</p>
          <button type="button" class="secondary" id="mic-prefs-btn">Mic settings</button>
          <p class="label">Look</p>
          <label class="slider-row">
            <span>Opacity</span>
            <input id="opacity-slider" type="range" min="28" max="92" value="55" />
          </label>
          <label class="check-row">
            <input id="solid-hover" type="checkbox" checked />
            Solid on hover
          </label>
          <label class="check-row">
            <input id="share-visible" type="checkbox" />
            Show HUD on screen share
          </label>
          <p class="fine" id="display-status">HUD on display 1</p>
          <button type="button" class="secondary" id="display-btn">Move to other display</button>
          <p class="fine" id="screen-status">Off</p>
          <button type="button" class="secondary" id="screen-settings-btn">Screen settings</button>
          <img id="screen-preview" alt="" hidden />
          <p class="fine" id="ws-status">Connecting…</p>
          <p class="fine" id="live-text">Ready.</p>
          <p class="fine" id="shortcut-hint"></p>
          <button type="button" class="secondary" id="shortcuts-btn">Edit shortcuts…</button>
          <p class="fine" id="perm-hint"></p>
          <p class="fine" id="coach"></p>
          <p class="fine" id="session-status">Not started.</p>
        </div>
      </div>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
